# Runs this repository's own action on its pull requests. The fixtures under
# test/fixtures match the default Prisma and Drizzle paths, so a PR that touches
# them gets a real report comment. fail-on: never because the fixtures are
# hazardous on purpose.
name: self-test
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  schemabrake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          fail-on: never
