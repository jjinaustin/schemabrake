# Keeps the major-version tag (v1, v2, ...) on the latest release, so users who
# pin `jjinaustin/schemabrake@v1` get every v1.x.y as it ships.
#
# For release events GitHub runs this file as it exists in the released commit,
# so a release only moves its major tag if the commit it tags contains this file.
# To move a tag for an existing release, use "Run workflow" with its tag name.
name: major-tag
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose major tag should point at it, e.g. v1.2.0
        required: true
permissions:
  contents: write
concurrency:
  group: major-tag
  cancel-in-progress: false
jobs:
  move:
    # Pre-releases don't move the tag that users pin.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Point the major tag at the release
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice title=major-tag::$TAG is not a vX.Y.Z release tag; nothing to move."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          # A backport (say v1.0.1 published after v1.1.0) must not move v1 backwards.
          # A manual run is deliberate and may.
          if [[ "$EVENT" == release ]]; then
            newest=$(git ls-remote --tags --refs origin "refs/tags/$major.*" | sed 's|.*refs/tags/||' \
              | grep -E "^$major\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
            if [[ "$newest" != "$TAG" ]]; then
              echo "::notice title=major-tag::$TAG is older than $newest; leaving $major where it is."
              exit 0
            fi
          fi
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git tag -f "$major" "$sha"
          git push -f origin "refs/tags/$major"
          echo "::notice title=major-tag::$major now points at $TAG ($sha)."
